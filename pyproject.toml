[project]
name = "llm-toolkit"
version = "0.1.0"
description = "Modül 2: sağlayıcıdan bağımsız LLM araç seti"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
llm = "llm_toolkit.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "streamlit>=1.67.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
