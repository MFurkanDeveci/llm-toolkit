[project]
name = "llm-toolkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Furkan", email = "mfdeveci.027@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.28.1",
    "ollama>=0.6.3",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
llm-toolkit = "llm_toolkit:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
